spring:
  cors:
    # 글로벌 CORS 설정
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization,Content-Disposition
    allow-credentials: false
    max-age: 3600
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  thymeleaf:
    cache: false
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MariaDB103Dialect
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 500
        show_sql: true
        format_sql: true

