<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragments/login_off_layout.html}">
<head>
    <meta charset="utf-8" />
    <title>PromoSense</title>
</head>
<body>
<div layout:fragment="content" th:remove="tag">
    <!-- page-body -->
    <div class="page-body page-login">
        <!-- local -->
        <div id="local">
            <!-- local-head -->
            <div class="local-head">
                <h2 class="local-subject" id="localSubject"><span class="local-name">로그인</span></h2>
            </div>
            <!-- //local-head -->
            <!-- local-body -->
            <div class="local-body">
                <!-- content -->
                <div id="content">
                    <!-- content-body -->
                    <div class="content-body">
                        <!-- info-board -->
                        <div class="info-board module-b style-a type-c attr-applied">
                            <div class="board-wrap">
                                <div class="board-head">
                                    <p class="board-subject"><span class="board-name">비밀번호 변경 되었습니다.</span></p>
                                    <p class="board-summary">감사합니다.</p>
                                </div>
                                <div class="board-util">
                                    <div class="button-display module-a style-a type-a">
											<span class="button-area">
												<a th:href="@{/login}"  class="btn module-b style-b type-fill accent-01 large-6x flex">확인</a>
											</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- //info-board -->
                    </div>
                    <!-- //content-body -->
                </div>
                <!-- //content -->
            </div>
            <!-- //local-body -->
        </div>
        <!-- //local -->
    </div>
</div>
</body>
</html>
