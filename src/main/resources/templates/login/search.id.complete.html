<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/login_off_layout.html}">

<head>
    <meta charset="utf-8" />
    <title>PromoSense</title>
</head>

<body>
    <div class="page-body page-login page-find-id" layout:fragment="content">
        <!-- local -->
        <div id="local">
            <!-- local-head -->
            <div class="local-head">
                <h2 class="local-subject" id="localSubject"><span class="local-name">로그인</span></h2>
            </div>
            <!-- //local-head -->
            <!-- local-body -->
            <div class="local-body">
                <!-- content -->
                <div id="content">
                    <!-- content-head -->
                    <div class="content-head">
                        <h3 class="content-subject" id="contentSubject"><span class="content-name">아이디 찾기</span></h2>
                            <p class="content-summary">아이디를 알려 드립니다.</p>
                    </div>
                    <!-- //content-head -->
                    <!-- content-body -->
                    <div class="content-body">
                        <!-- info-board -->
                        <div class="info-board module-c style-a type-c">
                            <div class="board-wrap">
                                <div class="board-body">
                                    <p class="para">아이디: <strong class="em accent-01" th:text="${admId}"></strong></p>
                                </div>
                                <div class="board-util">
                                    <div class="button-display module-a style-a type-a"><span class="button-area"><a th:href="@{/login}" class="btn module-b style-b type-fill accent-01 large-6x flex">확인</a></span></div>
                                </div>
                            </div>
                        </div>
                        <!-- //info-board -->
                    </div>
                    <!-- //content-body -->
                </div>
                <!-- //content -->
            </div>
            <!-- //local-body -->
        </div>
        <!-- //local -->
    </div>
    <!-- //page-body -->
</body>
</html>
