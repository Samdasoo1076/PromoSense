<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/login_off_layout.html}">

<head>
    <meta charset="utf-8" />
    <title>SKB DOMS</title>
</head>

<body>
    <!-- page-body -->
    <div class="page-body page-login page-find-password" layout:fragment="content">
        <!-- local -->
        <div id="local">
            <!-- local-head -->
            <div class="local-head">
                <h2 class="local-subject" id="localSubject"><span class="local-name">로그인</span></h2>
            </div>
            <!-- //local-head -->
            <!-- local-body -->
            <div class="local-body">
                <!-- content -->
                <div id="content">
                    <!-- content-head -->
                    <div class="content-head">
                        <h2 class="content-subject" id="contentSubject"><span class="content-name">비밀번호 찾기</span></h2>
                        <p class="content-summary">
                            등록된 아이디, 이메일 주소를 입력해주세요.<br />
                            <em class="em accent-04">비밀번호 재발급은 보안을 위해서 월 3회로 제한됩니다.</em>
                        </p>
                    </div>
                    <!-- //content-head -->
                    <!-- content-body -->
                    <form class="content-body" id="frm" name="frm" th:object="${user}" method="post" th:action="@{/search/password/find}" onsubmit="return false">
                        <!-- submit-form -->
                        <fieldset class="submit-form module-b style-a type-c large-6x">
                            <legend>로그인정보 입력 서식</legend>
                            <div class="form-list">
                                <div class="form-item">
                                    <div class="form-wrap">
                                        <div class="form-head">
                                            <p class="form-subject"><label for="admId" class="form-name">아이디</label></p>
                                        </div>
                                        <div class="form-body">
                                            <div class="form-area">
                                                <span class="form textfield module-b style-b type-fill normal-01 large-6x flex">
                                                    <input type="text" class="form-elem" id="admId" placeholder="아이디 입력"
                                                           name="admId" data-bui-form-cancel="true" th:value="${user.admId}" />
                                                </span>
                                            </div>
                                            <p id="msgAdmId" class="form-noti invalid">
                                                <th:block th:errors="${user.admId}"></th:block>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-item">
                                    <div class="form-wrap">
                                        <div class="form-head">
                                            <p class="form-subject"><label for="admEmail" class="form-name">이메일 주소</label></p>
                                        </div>
                                        <div class="form-body">
                                            <div class="form-area">
                                                <span class="form textfield module-b style-b type-fill normal-01 large-6x flex">
                                                    <input type="email" class="form-elem" id="admEmail" placeholder="이메일 입력"
                                                           name="admEmail" data-bui-form-cancel="true" th:value="${user.admEmail}" />
                                                </span>
                                            </div>
                                            <p id="msgAdmEmail" class="form-noti invalid">
                                                <th:block th:errors="${user.admEmail}"></th:block>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- button-display -->
                            <div class="button-display module-a style-b type-a">
                                <span class="button-area">
                                    <button id="btnSearch" type="submit" class="btn module-b style-b type-fill accent-01 large-6x flex disabled">확인</button>
                                </span>
                            </div>
                            <!-- //button-display -->
                            <script th:inline="javascript">
                                const isError = [[${#fields.hasGlobalErrors()}]];
                                const errorMsgs = [[${#fields.globalErrors()}]];
                                if(isError) {
                                    window.onload = function () {
                                        Modal.alert(errorMsgs);
                                    }
                                }
                            </script>
                        </fieldset>
                        <!-- //submit-form -->
                    </form>
                    <!-- //content-body -->
                </div>
                <!-- //content -->
            </div>
            <!-- //local-body -->
        </div>
        <!-- //local -->
    </div>
    <!-- //page-body -->
</body>
</html>
<script type="text/javascript" th:src="@{/js/login/search.password.js}"></script>
