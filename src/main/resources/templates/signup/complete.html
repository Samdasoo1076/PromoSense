<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{fragments/login_off_layout.html}">
<head>
    <meta charset="utf-8" />
    <title>SKB DOMS</title>
</head>
<body>
<div layout:fragment="content" th:remove="tag">
    <!-- page-body -->
    <div class="page-body page-login">
        <!-- local -->
        <div id="local">
            <!-- local-head -->
            <div class="local-head">
                <h2 class="local-subject" id="localSubject"><span class="local-name">로그인</span></h2>
            </div>
            <!-- //local-head -->
            <!-- local-body -->
            <div class="local-body">
                <!-- content -->
                <div id="content">
                    <!-- content-body -->
                    <div class="content-body">
                        <!-- info-board -->
                        <div class="info-board module-b style-a type-c attr-applied">
                            <div class="board-wrap">
                                <div class="board-head">
                                    <p class="board-subject"><span class="board-name">DOMS 계정 신청이 완료되었습니다.</span></p>
                                    <p class="board-summary">계정 관리자 승인 후 이용이 가능합니다.<br />신청 현황은 가입하신 메일로 발송해 드립니다. 감사합니다.</p>
                                </div>
                                <div class="board-body">
                                    <div class="data-list module-b style-a type-a normal-02 small-3x">
                                        <p class="data-item">메일 확인이 안 될 경우 스팸메일 보관함을 확인해주세요.</p>
                                    </div>
                                </div>
                                <div class="board-util">
                                    <div class="button-display module-a style-a type-a">
                                        <span class="button-area">
                                            <a th:href="@{/}" class="btn module-b style-b type-fill accent-01 large-6x flex">확인</a>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- //info-board -->
                    </div>
                    <!-- //content-body -->
                </div>
                <!-- //content -->
            </div>
            <!-- //local-body -->
        </div>
        <!-- //local -->
    </div>
</div>
</body>
</html>
